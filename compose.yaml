
services:
  postgres:
    image: postgres:17
    container_name: perfumehub-postgres
    environment:
      POSTGRES_DB: perfumehub
      POSTGRES_USER: perfumehub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumehub -d perfumehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
